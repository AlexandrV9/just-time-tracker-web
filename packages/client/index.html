<!doctype html>
<html lang="en">
  <head>
    <title>Just Time Tracker</title>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Just Time Tracker — a time tracker for daily activities."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Time Tracker" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Just Time Tracker" />
    <meta
      property="og:description"
      content="A time tracker for daily activities."
    />
    <meta property="og:image" content="/icons/logo-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Just Time Tracker" />
    <meta
      name="twitter:description"
      content="A time tracker for daily activities."
    />
    <meta name="twitter:image" content="/icons/logo-512x512.png" />

    <link rel="icon" href="/icons/logo.ico" sizes="48x48" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/logo-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/logo-180x180.png"
    />
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
