<svg
  width="120"
  height="120"
  viewBox="0 0 120 120"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="bg"
      x1="0"
      y1="0"
      x2="120"
      y2="120"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#4F46E5" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="26" fill="url(#bg)" />

  <g>
    <!-- Clock ring: gap on the left for the bolt -->
    <circle
      cx="70"
      cy="60"
      r="27"
      stroke="white"
      stroke-width="6"
      fill="none"
      stroke-linecap="round"
      stroke-dasharray="130 40"
      transform="rotate(-105 70 60)"
    />

    <!-- Clock hands -->
    <path
      d="M70 60V43"
      stroke="white"
      stroke-width="5.5"
      stroke-linecap="round"
    />
    <path
      d="M70 60L79 68"
      stroke="white"
      stroke-width="5.5"
      stroke-linecap="round"
    />
    <circle cx="70" cy="60" r="3.5" fill="white" />

    <!-- Lightning (foreground, full shape) -->
    <path
      fill="white"
      d="M36 24L20 56H34L26 90L56 56H42L50 24H36Z"
    />
  </g>
</svg>
